<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/dashboard"></ion-back-button></ion-buttons>
    <ion-title>Latest Updates</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="bg_color" fullscreen>
  <ion-list lines="none">
      <ion-item *ngFor="let noti of notificationData">
          <div class="item_inner d-flex">
              <div class="img_box center_img">
                  <img src="assets/imgs/icon.png" class="crop_img">
              </div>
              <div class="text_box">
                  <h2 class="d-flex">
                      {{noti.title}}
                  </h2>
                  <p class="d-flex">{{noti.description}}</p>
              </div>
          </div>
      </ion-item>
  </ion-list>
</ion-content>
