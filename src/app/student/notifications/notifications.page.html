<ion-header class="ion-no-border modern-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Notifications</ion-title>
    <ion-buttons slot="end" *ngIf="unreadCount > 0">
      <ion-button fill="clear" (click)="markAllAsRead()">
        <ion-icon slot="icon-only" name="checkmark-done-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="modern-content">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-outline" refreshingSpinner="crescent">
    </ion-refresher-content>
  </ion-refresher>

  <ng-container *ngIf="isLoaded">
    <!-- Unread Badge Summary -->
    <div class="unread-summary" *ngIf="unreadCount > 0">
      <div class="unread-info">
        <ion-icon name="notifications-outline"></ion-icon>
        <span>{{unreadCount}} unread notification{{unreadCount > 1 ? 's' : ''}}</span>
      </div>
      <ion-button fill="clear" size="small" (click)="markAllAsRead()">
        Mark all read
      </ion-button>
    </div>

    <!-- Notifications List -->
    <div class="notifications-list" *ngIf="notifications.length > 0">
      <div class="notification-card" *ngFor="let noti of notifications"
        [class.unread]="noti.is_read === 0"
        (click)="markAsRead(noti)">
        <div class="notification-header">
          <div class="notification-icon" [class.unread-icon]="noti.is_read === 0">
            <ion-icon name="notifications-outline"></ion-icon>
          </div>
          <div class="notification-info">
            <h3>{{noti.title}}</h3>
            <p class="notification-time">
              <ion-icon name="time-outline"></ion-icon>
              {{getTimeAgo(noti.created)}}
            </p>
          </div>
          <span class="unread-dot" *ngIf="noti.is_read === 0"></span>
        </div>
        <p class="notification-body">{{noti.description}}</p>
        <div class="notification-image" *ngIf="noti.image">
          <img [src]="noti.image" alt="Notification image" onerror="this.style.display='none'">
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="notifications.length === 0">
      <ion-icon name="notifications-off-outline"></ion-icon>
      <h3>No notifications</h3>
      <p>You're all caught up! New notifications will appear here.</p>
    </div>
  </ng-container>

  <!-- Infinite Scroll for Pagination -->
  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)" *ngIf="isLoaded && currentPage < totalPages">
    <ion-infinite-scroll-content loadingSpinner="crescent" loadingText="Loading more...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
