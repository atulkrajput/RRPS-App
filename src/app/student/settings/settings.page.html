<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item (click)="changePasswordPrompt()">
      <ion-label color="primary">Change Password</ion-label>
    </ion-item>
    <ion-item>
      <ion-label color="primary">Notification</ion-label>
      <ion-toggle (ionChange)='changeNotification()' slot="end" name="notification" color="primary" checked></ion-toggle>
    </ion-item>
  </ion-list>
  <h3>Find us on Social Media</h3>
  <ion-list>
    <ion-item (click)="goToBrowser(0)" detail >
      <ion-label color="primary">Facebook</ion-label>
      <ion-icon slot="end" name="logo-facebook"></ion-icon>
    </ion-item>
    <ion-item (click)="goToBrowser(1)" detail>
      <ion-label color="primary">Twitter</ion-label>
      <ion-icon slot="end" name="logo-twitter"></ion-icon>
    </ion-item>
    <ion-item (click)="goToBrowser(2)" detail >
      <ion-label color="primary">Instagram</ion-label>
      <ion-icon slot="end" name="logo-instagram"></ion-icon>
    </ion-item>
  </ion-list>
  <h3>Other info</h3>
  <ion-list>
    <ion-item (click)="rateApp()" detail >
      <ion-label color="primary">Rate App</ion-label>
    </ion-item>
    <ion-item >
      <ion-label slot="start" color="primary">App Version</ion-label>
      <ion-note slot="end" color="primary">{{fetchAppVersion()}}</ion-note>
    </ion-item>
  </ion-list>
</ion-content>
