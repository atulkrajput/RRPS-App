<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Fees</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row class="ion-justify-content-evenly">
      <ion-col class="ion-align-self-stretch" size="12">
        <ion-card>
          <ion-card-header>
            <ion-card-title class="ion-text-capitalize"></ion-card-title>
            <ion-card-subtitle color="primary" >Pending Fee Details (Rs.)</ion-card-subtitle>
          </ion-card-header>

          <ion-card-content>
            <div class="details">
              <ion-grid>
                <ion-row>
                  <ion-col size='5'>
                    Old Balance
                  </ion-col>
                  <ion-col size='6' class="ion-text-wrap ion-text-capitalize ion-no-margin">
                    0
                  </ion-col>
                </ion-row>
                <ion-row>
                  <ion-col size='5'>
                    Monthly Fee
                  </ion-col>
                  <ion-col size='6' class="ion-text-wrap ion-no-margin">
                    6018
                  </ion-col>
                </ion-row>
                <ion-row>
                  <ion-col size='5'>
                    Transport Fee
                  </ion-col>
                  <ion-col size='6' class="ion-text-wrap ion-no-margin">
                    0
                  </ion-col>
                </ion-row>
                <ion-row>
                  <ion-col size='5'>
                    Total Fee
                  </ion-col>
                  <ion-col size='6' class="ion-text-wrap ion-no-margin">
                    6018
                  </ion-col>
                </ion-row>
              </ion-grid>
              <ion-button size="small" slot="end">Pay now</ion-button>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
  <ion-item-divider  color="primary">
    <ion-label>
      Previous Payments
    </ion-label>
  </ion-item-divider>
  <ion-list>
    <ion-item lines="none" class="item-text-wrap" *ngFor="let feeH of feeHistoryData">
      <ion-label>
        <div *ngIf="feeH.fee_type === 1">Tution Fee - Rs. {{feeH.fees_deposited}}</div>
        <span *ngIf="feeH.fee_type === 2">Transport Fee - Rs. {{feeH.fees_deposited}}</span>
        <span> CASH, {{feeH.fee_deposit_date | date}}</span>
      </ion-label>
      <div class="item-note" slot="end">
        <ion-button color="primary" [disabled]="true">Receipt</ion-button>
      </div>
    </ion-item>
  </ion-list>
</ion-content>
