<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Exams</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ng-container *ngFor="let examT of examtitleData;">
      <ion-item-divider  color="primary">
        <ion-label>
          {{examT.exam_title.title}}
        </ion-label>
      </ion-item-divider>
      <ng-container *ngFor="let exam of examData;">
        <ion-item lines="none" class="item-text-wrap" *ngIf="examT.exam_title_id===exam.exam_title_id">
          <ion-label>
            {{exam.subject.subject_name}}
            <span> {{exam.exam_date | date}}, {{exam.exam_students[0].obtained_marks}}/{{exam.exam_students[0].total_marks}} ({{exam.exam_students[0].percentage}} %)</span>
          </ion-label>
          <!-- <div class="item-note" slot="end">
            <ion-button color="secondary">Key</ion-button>
          </div> -->
        </ion-item>
      </ng-container>
    </ng-container>
  </ion-list>
</ion-content>
