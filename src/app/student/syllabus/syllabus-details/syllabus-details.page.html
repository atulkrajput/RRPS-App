<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{subjectName}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card (click)="show(i)" *ngFor="let syllabus of syllabusData; let i = index">
    <ion-card-header>
      <ion-card-title>
        {{syllabus.subject_unit.unit_no}} - {{syllabus.subject_unit.unit_name}}
      </ion-card-title>
      <ion-icon slot="end" name="arrow-down-circle-outline" color="light"></ion-icon>
    </ion-card-header>
    <ion-card-content *ngIf="sylExpand[i]">
      <ion-text *ngFor="let inner of syllabus.chapter_notes">
        <p>
          {{inner.subject_chapter.chapter_name}} -  {{inner.subject_chapter.chapter_no}}
        </p>
        <ul class="ion-text-wrap ion-text-left">
          <li><a [href]="syllabus.noteURL+inner.notes">Download Notes</a></li>
        </ul>
      </ion-text>
    </ion-card-content>
  </ion-card>
</ion-content>
