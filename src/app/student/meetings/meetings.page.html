<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button autoHide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Meetings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item-divider  color="primary" class="ion-margin">
    <ion-label>
      Upcoming Meetings
    </ion-label>
  </ion-item-divider>
  <ion-list>
    <ion-item lines="none" class="item-text-wrap" *ngFor="let meeting of newmeetingsData">
      <ion-label>
        {{meeting.meeting_name}}
        <span> {{meeting.meeting_date | date}}</span>
      </ion-label>
    </ion-item>
  </ion-list>
  <ion-item-divider  color="primary" class="ion-margin">
    <ion-label>
      Meetings History
    </ion-label>
  </ion-item-divider>
  <ion-list>
    <ion-item lines="none" class="item-text-wrap" *ngFor="let meeting of meetingsData">
      <ion-label>
        {{meeting.meeting_name}}
        <span> {{meeting.meeting_date | date}}</span>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
