<div class="menu-wrapper">
  <div class="profile-header" [style.background]="houseGradient">
    <div class="profile-avatar">
      <img [src]="profilePic" onerror='this.src="assets/imgs/profile.png"' alt="Profile">
    </div>
    <h2 class="ion-text-capitalize" *ngIf="studentName">{{studentName}}</h2>
    <p class="reg-id" *ngIf="regId">
      <ion-icon name="card-outline"></ion-icon>
      {{regId}}
    </p>
    <span class="class-badge" *ngIf="classSection">
      <ion-icon name="school-outline"></ion-icon>
      {{classSection}}
    </span>
  </div>

  <div class="nav">
    <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages">
      <div class="nav-item" [routerLink]="[p.url]" routerLinkActive="active">
        <span class="nav-icon">
          <ion-icon [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
        </span>
        <span class="nav-label">{{p.title}}</span>
      </div>
    </ion-menu-toggle>
  </div>

  <div class="footer">
    <span class="app-version">RRPS v{{appVersion}}</span>
  </div>
</div>
