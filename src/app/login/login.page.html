<ion-content class="login-content" [scrollY]="false">
  <div class="login-wrapper">

    <!-- Logo Section -->
    <div class="login-header">
      <div class="logo-container">
        <img src="assets/imgs/icon.png" alt="RR Public School">
      </div>
      <h1 class="app-title">R.R. Public School, Noorpur</h1>
      <p class="login-subtitle">Student Panel</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <h2 class="card-title">Welcome Back</h2>
      <p class="card-subtitle">Sign in to continue</p>

      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <!-- Registration ID -->
        <div class="input-group" [class.error]="loginForm.get('regid').invalid && (loginForm.get('regid').touched || loginFormSubmit)">
          <div class="input-icon">
            <ion-icon name="person-outline"></ion-icon>
          </div>
          <ion-input
            type="text"
            formControlName="regid"
            placeholder="Registration ID"
            class="modern-input">
          </ion-input>
        </div>
        <p class="error-msg" *ngIf="loginForm.get('regid').hasError('required') && (loginForm.get('regid').touched || loginFormSubmit)">
          Registration ID is required
        </p>

        <!-- Password -->
        <div class="input-group" [class.error]="loginForm.get('password').invalid && (loginForm.get('password').touched || loginFormSubmit)">
          <div class="input-icon">
            <ion-icon name="lock-closed-outline"></ion-icon>
          </div>
          <ion-input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Password"
            class="modern-input">
          </ion-input>
          <div class="toggle-password" (click)="showPassword = !showPassword">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </div>
        </div>
        <p class="error-msg" *ngIf="loginForm.get('password').hasError('required') && (loginForm.get('password').touched || loginFormSubmit)">
          Password is required
        </p>

        <!-- Login Button -->
        <ion-button expand="block" type="submit" class="login-btn">
          <ion-icon slot="start" name="log-in-outline"></ion-icon>
          Sign In
        </ion-button>
      </form>

      <p class="help-note">
        Don't know your credentials? Contact School.
      </p>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <div class="footer-links">
        <ion-button fill="clear" size="small" routerLink="/about">
          <ion-icon slot="start" name="information-circle-outline"></ion-icon>
          About
        </ion-button>
        <ion-button fill="clear" size="small" routerLink="/terms">
          <ion-icon slot="start" name="document-text-outline"></ion-icon>
          Terms
        </ion-button>
        <ion-button fill="clear" size="small" routerLink="/privacy">
          <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
          Privacy
        </ion-button>
      </div>
      <p class="powered-by">Powered by LALogix Enterprises</p>
    </div>
  </div>
</ion-content>
