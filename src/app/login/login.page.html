<ion-content class="login-content">
  <div class="login-wrapper">
    <!-- Logo -->
    <div class="login-logo">
      <img src="assets/imgs/logo.png" alt="RR Public School">
    </div>
    <p class="login-subtitle">Student Portal</p>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="input-group">
        <ion-icon name="person-outline" class="field-icon"></ion-icon>
        <ion-input type="text" formControlName="regid" placeholder="Registration ID"></ion-input>
      </div>
      <div class="error-msg" *ngIf="loginForm.get('regid').hasError('required') && (loginForm.get('regid').touched || loginFormSubmit)">
        Registration ID is required
      </div>

      <div class="input-group">
        <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
        <ion-input type="password" formControlName="password" placeholder="Password"></ion-input>
      </div>
      <div class="error-msg" *ngIf="loginForm.get('password').hasError('required') && (loginForm.get('password').touched || loginFormSubmit)">
        Password is required
      </div>

      <ion-button expand="block" type="submit" class="login-btn">
        Sign In
      </ion-button>
    </form>

    <p class="help-note">Contact school admin if you forgot your credentials</p>
  </div>

  <div class="login-footer">
    <div class="footer-links">
      <ion-button fill="clear" size="small" routerLink="/about">
        <ion-icon slot="start" name="information-outline"></ion-icon>
        About
      </ion-button>
      <ion-button fill="clear" size="small" routerLink="/terms">
        <ion-icon slot="start" name="document-text-outline"></ion-icon>
        Terms
      </ion-button>
      <ion-button fill="clear" size="small" routerLink="/privacy">
        <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
        Privacy
      </ion-button>
    </div>
    <p>Powered by Doon Portal</p>
  </div>
</ion-content>
